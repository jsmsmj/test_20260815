<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sample Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
</div>
<div id="name-entry-label">ランキングに登録する名前<span>(空欄のままでもOK)</span></div>
<input id="name-input" type="text" maxlength="20" placeholder="名前(空欄可)" autocomplete="off" />
<button id="name-confirm-btn" type="button">OK</button>
<button id="title-ranking-btn" type="button">ランキングを見る</button>
<button id="title-change-name-btn" type="button">名前を変える</button>
<button id="ranking-back-btn" type="button">戻る</button>
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<script src="main.js"></script>
</body>
</html>
